<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Product preview card component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="product-card">
    <div class="product-image">
      <picture>
        <source srcset="../product-preview-card-component-main/images/image-product-desktop.jpg" media="(min-width: 600px)">
      </picture>
      <img src="../product-preview-card-component-main/images/image-product-desktop.jpg" alt="bottle lying on a table with green leaves">
    </div>
    <div class="product-content">
      <p class="product-category">PERFUME</p>
      <h1 class="product-title">Gabrielle Essence Eau De Parfum</h1>
      <p class="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.</p>

      <div class="price-group">
        <span class="price-current">$149.99</span>
        <span class="price-original">$169.99</span>
      </div>

      <button class="btn-add-cart">
        <svg></svg>
        Add to Cart
      </button>
    </div>
  </main>

  <footer class="attribution"></footer>
</body>

</html>
